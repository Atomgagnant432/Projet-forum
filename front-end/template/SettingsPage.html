<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Paramètres</title>
    <link rel="stylesheet" href="../static/css/settings.css">
</head>
<body>

<div class="sidebar">
        <div class="sidebar-search" id="sidebar-search">
           <input type="text" placeholder="Rechercher...">
        </div>
        <ul>
        <li>
            <a href="/">
                <img src="../static/icons/HomeIcon.png" class="icon" alt="Accueil">
                <span class="text">Accueil</span>
            </a>
        </li>

        <li>
            <a href="/profile">
                <img src="../static/icons/ProfilIcon.png" class="icon" alt="Profil">
                <span class="text">Profil</span>
            </a>
        </li>

        <li>
            <a href="/settings">
                <img src="../static/icons/SettingsIcon.png" class="icon" alt="Settings">
                <span class="text">Paramètres</span>
            </a>
        </li>
    </ul>
    </div>

    <header class="header" id="header">
        <div class="header-logo">
            <a href="/"><img src="../static/icons/logo.png" alt="Logo"></a>
        </div>

        <div class="header-search" id="header-search">
            <span class="search-icon"></span>
            <input type="text" placeholder="Rechercher...">
        </div>
        <div class="header-title">FOR MENTOR</div>
    </header>

<div class="settings-container">
    <h1>Paramètres du compte</h1>

    <!-- Changer username -->
    <section class="setting-card">
        <h2>Nom d'utilisateur</h2>

        <form action="/settings/username" method="POST">
            <input
                type="text"
                name="pseudo"
                placeholder="Nouveau pseudo"
                required
            >
            <button type="submit">Modifier</button>
        </form>
    </section>

    <!-- Changer mot de passe -->
    <section class="setting-card">
        <h2>Mot de passe</h2>

        <form action="/settings/password" method="POST">
            <input
                type="password"
                name="old_password"
                placeholder="Mot de passe actuel"
                required
            >

            <input
                type="password"
                name="new_password"
                placeholder="Nouveau mot de passe"
                required
            >

            <button type="submit">
                Changer le mot de passe
            </button>
        </form>
    </section>

    <!-- Compte privé/public -->
    <section class="setting-card">
        <h2>Confidentialité</h2>

        <form action="/settings/privacy" method="POST">
            <label class="switch">
                <input type="checkbox" name="is_private">
                <span class="slider"></span>
            </label>

            <span>Compte privé</span>

            <button type="submit">
                Enregistrer
            </button>
        </form>
    </section>

    <!-- Thème -->
    <section class="setting-card">
        <h2>Thème</h2>

        <button id="theme-toggle">
            Basculer thème clair/sombre
        </button>
    </section>

    <!-- Déconnexion -->
    <section class="setting-card">
        <h2>Session</h2>

        <form action="/logout" method="POST">
            <button class="logout-btn">
                Déconnexion
            </button>
        </form>
    </section>
</div>

</body>
</html>
