<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Publication</title>

    <link rel="stylesheet" href="../static/css/creationPage.css">
</head>

<body>

    <section class="post-form">
        <form action="/post/create" method="POST" enctype="multipart/form-data">

            <h1>Nouveau post</h1>

            <div class="form-group">
                <label for="title">Titre :</label>

                <input
                    type="text"
                    name="title"
                    id="title"
                    placeholder="Quoi de neuf ?"
                    required
                >
            </div>

            <div class="form-group">
                <label for="content">Contenu :</label>

                <div class="content-box">

                    <textarea
                        name="content"
                        id="content"
                        placeholder="..."
                        required
                    ></textarea>

                    
                    <div id="image-preview-container" hidden>

                        <img
                            id="image-preview"
                            alt="Prévisualisation de l'image"
                        >

                        <button
                            type="button"
                            id="remove-image-btn"
                            aria-label="Supprimer l'image"
                        >
                            ×
                        </button>

                    </div>

                    <div class="content-toolbar">

    
                        <label for="image" class="toolbar-btn">
                            <img
                                src="../static/img/add-img.png"
                                alt="Ajouter une image"
                            >
                        </label>

                        <input
                            type="file"
                            name="image"
                            id="image"
                            accept="image/png, image/jpeg, image/gif"
                        >

                    
                        <details class="category-toolbar-dropdown">

                            <summary class="toolbar-btn">
                                <img
                                    src="../static/img/add-categories.png"
                                    alt="Ajouter des catégories"
                                >
                            </summary>

                            <div class="category-toolbar-options">

                                {{range .Categories}}

                                    <label>
                                        <input
                                            type="checkbox"
                                            name="categories"
                                            value="{{.ID}}"
                                        >

                                        {{.Name}}
                                    </label>

                                {{end}}

                            </div>

                        </details>

                        <button type="submit" class="post-btn">
                            Poster
                        </button>

                    </div>

                </div>
            </div>

        </form>
    </section>

    <script src="../static/js/creationPage.js"></script>

</body>
</html>
