<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil</title>
    <link rel="stylesheet" href="../static/css/common.css">
    <link rel="stylesheet" href="../static/css/homePage.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-search" id="sidebar-search">
           <input type="text" placeholder="Rechercher...">
        </div>
        <ul>
        <li>
            <a href="HomePage.html">
                <img src="../static/icons/HomeIcon.png" class="icon" alt="Accueil">
                <span class="text">Accueil</span>
            </a>
        </li>

        <li>
            <a href="ProfilPage.html">
                <img src="../static/icons/ProfilIcon.png" class="icon" alt="Profil">
                <span class="text">Profil</span>
            </a>
        </li>

        <li>
            <a href="SettingsPage.html">
                <img src="../static/icons/SettingsIcon.png" class="icon" alt="Settings">
                <span class="text">Paramètres</span>
            </a>
        </li>
    </ul>
    </div>

    <header class="header" id="header">
        <div class="header-logo">
            <img src="../static/icons/logo.png" alt="Logo">
        </div>

        <div class="header-search" id="header-search">
            <span class="search-icon"></span>
            <input type="text" placeholder="Rechercher...">
        </div>
        <div class="header-title">IL FAUT BLOQUER</div>
    </header>

    <section class="content">


        <div class="posts-container">
            <div class="posts-header">

                <form action="" method="GET" class="filter-form">
                    <details class="dropdown-filter">
                        <summary>Filtrer par catégories</summary>

                        <div class="dropdown-content">
                            {{range .Categories}}
                                <label>
                                    <input type="checkbox" name="category_id" value="{{.ID}}">
                                    {{.Name}}
                                </label>
                            {{end}}
                        </div>
                    </details>

                    <button type="submit">Appliquer</button>
                </form>

                <p class="last-post-title">Dernier post :</p>

            </div>

            {{range .Posts}}
                <div class="post-card">
                    <h2 class="user-link"><a href="/profil/user?id={{.UserID}}">{{.Avatar}} {{.Pseudo}}</a></h2>
                    <h2>{{.Title}}</h2>
                    <p>{{.Content}}</p>
                    <small>Posté le {{.CreatedAt}}</small>
                </div>
            {{else}}
                <p>Aucun post pour le moment.</p>
            {{end}}

            <a href="../template/creationPage.html" id="new-post-btn">
                Créer un nouveau post
            </a>
        </div>

    </section>





</body>
</html>
